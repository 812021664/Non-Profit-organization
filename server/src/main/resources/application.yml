server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: kindred-nonprofit-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kindred;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kindred}
    username: ${SPRING_DATASOURCE_USERNAME:kindred}
    password: ${SPRING_DATASOURCE_PASSWORD:}
